<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="theme-color"
    content="#f5f5f7"
  >

  <meta
    name="description"
    content="دفتري الشخصي لإدارة الدخل والمصروفات والادخار والديون"
  >

  <title>دفتري</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- Header -->
    <header class="header">

      <div class="brand">
        <h1>دفتري</h1>
        <p>إدارة أموالك بكل بساطة</p>
      </div>

      <button
        class="profile-button"
        type="button"
        aria-label="الملف الشخصي"
      >
        👤
      </button>

    </header>


    <!-- Month selector -->
    <section class="month-card">

      <div class="month-navigation">

        <button
          class="month-button"
          id="nextMonth"
          type="button"
          aria-label="الشهر التالي"
        >
          ‹
        </button>

        <div class="month-info">
          <strong id="monthName">سبتمبر 2026</strong>
          <span>الملخص المالي للشهر</span>
        </div>

        <button
          class="month-button"
          id="previousMonth"
          type="button"
          aria-label="الشهر السابق"
        >
          ›
        </button>

      </div>

    </section>


    <!-- Balance -->
    <section class="balance-card">

      <div class="balance-label">
        المتبقي هذا الشهر
      </div>

      <div class="balance-value">
        <span id="remaining">0</span>
        <span class="currency">د.ع</span>
      </div>

      <div class="balance-footer">

        <div class="balance-item">
          <span>الدخل</span>
          <strong id="balanceIncome">0 د.ع</strong>
        </div>

        <div class="balance-item">
          <span>المصروفات</span>
          <strong id="balanceExpenses">0 د.ع</strong>
        </div>

      </div>

    </section>


    <!-- Financial summary -->
    <h2 class="section-title">
      الملخص المالي
    </h2>

    <section class="financial-grid">

      <!-- Income -->
      <article class="financial-card">

        <div class="card-icon income-icon">
          💰
        </div>

        <div class="card-label">
          الدخل
        </div>

        <div
          class="card-value income-value"
          id="income"
        >
          0
        </div>

      </article>


      <!-- Expenses -->
      <article class="financial-card">

        <div class="card-icon expense-icon">
          💸
        </div>

        <div class="card-label">
          المصروفات
        </div>

        <div
          class="card-value expense-value"
          id="expenses"
        >
          0
        </div>

      </article>


      <!-- Savings -->
      <article class="financial-card">

        <div class="card-icon saving-icon">
          🏦
        </div>

        <div class="card-label">
          الادخار
        </div>

        <div
          class="card-value saving-value"
          id="savings"
        >
          0
        </div>

      </article>


      <!-- Amount owed -->
      <article class="financial-card">

        <div class="card-icon debt-icon">
          📋
        </div>

        <div class="card-label">
          مطلوب إليك
        </div>

        <div
          class="card-value debt-value"
          id="owed"
        >
          0
        </div>

      </article>

    </section>


    <!-- Quick actions -->
    <h2 class="section-title">
      إجراءات سريعة
    </h2>

    <section class="actions">

      <button
        class="action-button"
        id="addIncomeButton"
        type="button"
      >

        <span class="action-icon">
          ➕
        </span>

        <span class="action-text">
          <strong>إضافة دخل</strong>
          <span>سجل دخلك لهذا الشهر</span>
        </span>

      </button>


      <button
        class="action-button"
        id="addExpenseButton"
        type="button"
      >

        <span class="action-icon">
          💸
        </span>

        <span class="action-text">
          <strong>إضافة مصروف</strong>
          <span>سجل أي مبلغ صرفته</span>
        </span>

      </button>


      <button
        class="action-button"
        id="addSavingsButton"
        type="button"
      >

        <span class="action-icon">
          🏦
        </span>

        <span class="action-text">
          <strong>إضافة ادخار</strong>
          <span>أضف مبلغًا إلى مدخراتك</span>
        </span>

      </button>


      <button
        class="action-button"
        id="addOwedButton"
        type="button"
      >

        <span class="action-icon">
          📋
        </span>

        <span class="action-text">
          <strong>مبلغ مطلوب إليك</strong>
          <span>سجل مبلغًا لك عند شخص</span>
        </span>

      </button>

    </section>

  </main>


  <!-- Bottom navigation -->
  <nav class="bottom-nav" aria-label="التنقل الرئيسي">

    <button
      class="nav-item active"
      type="button"
      data-section="home"
    >
      <span class="nav-icon">⌂</span>
      الرئيسية
    </button>

    <button
      class="nav-item"
      type="button"
      data-section="expenses"
    >
      <span class="nav-icon">↙</span>
      المصروفات
    </button>

    <button
      class="nav-item"
      type="button"
      data-section="car"
    >
      <span class="nav-icon">🚗</span>
      السيارة
    </button>

    <button
      class="nav-item"
      type="button"
      data-section="more"
    >
      <span class="nav-icon">•••</span>
      المزيد
    </button>

  </nav>


  <script src="script.js"></script>

</body>
</html>
